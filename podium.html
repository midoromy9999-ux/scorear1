<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100dvh;
    min-height: 100dvh;
    width: 100%;
    max-width: 100vw;
    background: #0c0d1d;
    color: #eceeff;
    font-family: Tajawal, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow-x: hidden !important;
    overflow-y: auto;
    box-sizing: border-box;
  }
  .podium-tester-bar {
    background: rgba(18, 20, 42, 0.95);
    border-bottom: 1px solid rgba(142, 100, 239, 0.3);
    padding: 6px 16px; flex-shrink: 0;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    z-index: 50;
  }
  .podium-stage-viewport {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    background: #080914;
    overflow: hidden;
  }
  @media (max-width: 960px) {
    .podium-tester-links {
      display: none !important;
    }
  }
  @media (max-width: 768px) {
    html, body {
      height: 100dvh;
      min-height: 100dvh;
    }
    .podium-tester-bar {
      height: auto !important;
      flex-wrap: wrap !important;
      justify-content: space-between !important;
      overflow: visible !important;
      padding: 5px 8px !important;
      gap: 4px !important;
    }
    .podium-tester-bar > div {
      flex-wrap: wrap !important;
      flex-shrink: 1 !important;
      gap: 4px !important;
      max-width: 100%;
    }
    #worldSelect {
      width: auto !important;
      flex: 0 0 auto !important;
      padding: 3px 5px !important;
      font-size: 10px !important;
    }
    .podium-tester-bar .test-btn {
      padding: 3px 6px !important;
      font-size: 10px !important;
      border-radius: 7px !important;
    }
    .podium-stage-viewport {
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
    }
    #podiumStageRoot {
      position: relative !important;
      inset: auto !important;
      flex: 1 !important;
      min-height: 100% !important;
      overflow: hidden !important;
    }
  }
  .test-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: #eceeff;
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .test-btn svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }
  .test-btn:hover {
    background: rgba(142, 100, 239, 0.22);
    border-color: rgba(172, 139, 242, 0.45);
    color: #ffffff;
  }
  .test-btn.primary {
    background: linear-gradient(110deg, #7550ef, #9665ff);
    border-color: rgba(196, 168, 255, 0.45);
    color: #ffffff;
    box-shadow: 0 4px 16px rgba(117, 80, 239, 0.34);
  }
  .sidebar {
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 260px;
    z-index: var(--z-sidebar, 200);
    box-shadow: none;
  }
  .sidebar.open {
    transform: translateX(0);
    display: flex;
    box-shadow: -20px 0 80px rgba(0, 0, 0, 0.85);
  }
</style>

<div class="podium-tester-bar scorear-control-bar" style="padding:7px 14px;min-height:44px;height:auto;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;z-index:50;flex-shrink:0;">
  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%;">

    <a href="index.html#home" class="test-btn podium-tester-links" style="text-decoration:none;padding:5px 10px;font-size:11.5px;"><i data-icon="home" data-size="13"></i><span>الرئيسية</span></a>
    <a href="index.html#worlds" class="test-btn podium-tester-links" style="text-decoration:none;padding:5px 10px;font-size:11.5px;"><i data-icon="planet" data-size="13"></i><span>العوالم</span></a>
    <a href="index.html#classrooms" class="test-btn podium-tester-links" style="text-decoration:none;padding:5px 10px;font-size:11.5px;"><i data-icon="school" data-size="13"></i><span>الصفوف</span></a>
    <a href="characters.html" class="test-btn podium-tester-links" style="text-decoration:none;padding:5px 10px;font-size:11.5px;"><i data-icon="spark" data-size="13"></i><span>الأبطال</span></a>
    <a href="cards.html" class="test-btn podium-tester-links" style="text-decoration:none;padding:5px 10px;font-size:11.5px;"><i data-icon="layers" data-size="13"></i><span>الكروت</span></a>
    <span class="scorear-control-pill" style="color:#fde68a;border-color:rgba(251,191,36,0.28);font-size:11.5px;"><i data-icon="crown" data-size="13"></i><span>منصة التتويج</span></span>
  </div>

  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%;">
    <select id="worldSelect" onchange="changeWorld(this.value)" style="background:rgba(20,22,46,0.88);border:1px solid rgba(255,255,255,0.16);color:#eceeff;padding:5px 9px;border-radius:10px;font-weight:800;font-size:11.5px;cursor:pointer;font-family:inherit;">
      <option value="royal">Royal · القصر الملكي</option>
      <option value="cosmic">Cosmic · الفضاء الكوني</option>
      <option value="treasure">Treasure · الكنز</option>
      <option value="stadium">Stadium · الاستاد</option>
      <option value="oasis">Oasis · الواحة</option>
      <option value="magic">Magic · السحر</option>
    </select>
    <button type="button" class="test-btn primary" onclick="ScoreARPodiumEffects.startCinematicShow()" style="padding:5px 12px;font-size:11.5px;white-space:nowrap;flex-shrink:0;"><i data-icon="play" data-size="13"></i><span>عرض سينمائي</span></button>
    <button type="button" class="test-btn" onclick="ScoreARPodiumEffects.advanceReveal()" style="padding:5px 10px;font-size:11.5px;white-space:nowrap;flex-shrink:0;"><i data-icon="skipForward" data-size="13"></i><span>التالي</span></button>
    <button type="button" class="test-btn" onclick="ScoreARPodiumEffects.revealAll()" style="padding:5px 10px;font-size:11.5px;white-space:nowrap;flex-shrink:0;"><i data-icon="zap" data-size="13"></i><span>كشف الكل</span></button>
    <button type="button" class="test-btn" onclick="initDemoPodium()" style="padding:5px 10px;font-size:11.5px;white-space:nowrap;flex-shrink:0;"><i data-icon="rotateCcw" data-size="13"></i><span>إعادة</span></button>
  </div>
</div>

<div class="podium-stage-viewport" id="scorearQuizHostStage">
  <!-- Host Podium will mount here -->
</div>

<script>
window.ScoreARQuizHost = {
  closeHostSession: function() {
    window.location.href = 'index.html#worlds';
  }
};

const samplePlayers = [
  { name: 'أحمد محمود', score: 1450, avatarId: 'char_01' },
  { name: 'سارة خالد', score: 1180, avatarId: 'char_02' },
  { name: 'عمر التميمي', score: 920, avatarId: 'char_03' },
  { name: 'مريم العتيبي', score: 760, avatarId: 'char_04' },
  { name: 'يوسف الأنصاري', score: 640, avatarId: 'char_05' },
  { name: 'خالد عبدالله', score: 580, avatarId: 'char_07' },
  { name: 'فاطمة الزهراء', score: 520, avatarId: 'char_12' }
];

let activeWorld = 'royal';

function initDemoPodium() {
  const stage = document.getElementById('scorearQuizHostStage');
  const room = {
    worldId: activeWorld,
    world: { id: activeWorld },
    players: samplePlayers
  };
  ScoreARPodiumEffects.renderHostPodium(stage, room);
}

function changeWorld(wid) {
  activeWorld = wid;
  initDemoPodium();
}

window.addEventListener('DOMContentLoaded', () => {
  initDemoPodium();
});
</script>
